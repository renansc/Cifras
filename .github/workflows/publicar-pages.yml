name: Publicar Cifras no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 reportlab
      - name: Gerar aplicação
        run: bash gerar.sh
      - name: Verificar controles de tom
        run: |
          grep -q 'NANOTECH_TRANSPOSICAO_EMBUTIDA' cifras.html
          grep -q 'ntChangeTone' cifras.html
      - name: Atualizar HTML no repositório (compatível com Pages pela branch)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cifras.html saida/NanotechSoft-Cifras.html
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar HTML publicado com transposição [skip ci]'
            git push
          fi
      - name: Preparar publicação
        run: |
          mkdir -p public
          cp cifras.html public/cifras.html
          cp cifras.html public/index.html
          mkdir -p public/saida
          cp cifras.html public/saida/NanotechSoft-Cifras.html
          cp Dados_App_Cifras.json public/Dados_App_Cifras.json
          cp sw.js manifest.webmanifest public/
          cp -r assets public/assets
          test -s public/sw.js
          test -s public/manifest.webmanifest
          grep -q 'serviceWorker.register' public/index.html
          test -s public/Dados_App_Cifras.json
          test -s public/assets/nanotechsoft-logo.png
          grep -q 'Dados_App_Cifras.json' public/saida/NanotechSoft-Cifras.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
