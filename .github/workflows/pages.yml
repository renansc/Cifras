name: Publicar Cifras no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar site estatico
        run: |
          mkdir -p _site
          cp -a . _site/
          rm -rf _site/.git _site/.github
          if [ -f _site/saida/NanotechSoft-Cifras.html ]; then
            printf '%s\n' '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=saida/NanotechSoft-Cifras.html"><title>Cifras</title></head><body><a href="saida/NanotechSoft-Cifras.html">Abrir Cifras</a></body></html>' > _site/index.html
          else
            printf '%s\n' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Cifras</title><h1>NanotechSoft-Cifras</h1><p>Arquivos da aplicacao ainda nao publicados.</p><p><a href="https://github.com/renansc/Cifras">Repositório</a></p>' > _site/index.html
          fi
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
