name: Corrigir publicação do HTML principal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recuperar-html.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recuperar HTML V16 do pacote já enviado
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile,io
          original='a592d3740bd145badb4b136ed154d2d11c2edc9b'
          raw=subprocess.check_output(['git','show',original+':NanotechSoft-Cifras-V16-Completo-Para-GitHub.zip'])
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              wanted='saida/NanotechSoft-Cifras.html'
              if wanted not in z.namelist():
                  raise SystemExit('HTML principal não encontrado no ZIP original')
              p=pathlib.Path(wanted)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(wanted))
              print('HTML recuperado:',p.stat().st_size,'bytes')
          PY
      - name: Registrar HTML no GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f saida/NanotechSoft-Cifras.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: incluir HTML principal no GitHub Pages"
            git push
          fi
