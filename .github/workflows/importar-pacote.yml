name: Importar pacote V16 para o repositório
on:
  push:
    branches: [main]
    paths:
      - 'NanotechSoft-Cifras-V16-Completo-Para-GitHub.zip'
      - '.github/workflows/importar-pacote.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair arquivos do pacote sem expor backups
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, shutil
          z = pathlib.Path('NanotechSoft-Cifras-V16-Completo-Para-GitHub.zip')
          if not z.exists():
              raise SystemExit('Envie o pacote ZIP na raiz do repositorio.')
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(z) as archive:
              for item in archive.infolist():
                  name = item.filename.replace('\\','/')
                  parts = pathlib.PurePosixPath(name).parts
                  if item.is_dir() or not parts or '..' in parts:
                      continue
                  if parts[0] in {'.git','.github'} or '/.git/' in '/'+name:
                      continue
                  if (pathlib.PurePosixPath(name).name.startswith('backup')
                      and name.lower().endswith('.json')) or '__pycache__' in parts:
                      continue
                  dest = (root / name).resolve()
                  if not dest.is_relative_to(root):
                      continue
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with archive.open(item) as fin, dest.open('wb') as fout:
                      shutil.copyfileobj(fin,fout)
          z.unlink()
          print('Arquivos extraidos com sucesso')
          PY
      - name: Registrar projeto completo no GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\nbackup*.json\n**/backup*.json\n__pycache__/\n*.pyc\n' >> .gitignore
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publicar aplicação NanotechSoft-Cifras V16 completa"
            git push
          fi
